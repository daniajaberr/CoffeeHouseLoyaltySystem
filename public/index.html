<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coffee House – Login</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- ── Login / Register Page ──────────────────────────────────────────────── -->
<!-- This is the only public page — no JWT needed to view it -->

<div class="auth-wrapper">
  <div class="auth-box">

    <h1>☕ Coffee House</h1>
    <p class="subtitle">Loyalty Rewards System</p>

    <!-- Tab buttons to switch between Login and Register forms -->
    <div class="tabs">
      <button class="tab-btn active" onclick="showTab('login')">Login</button>
      <button class="tab-btn" onclick="showTab('register')">Register</button>
    </div>

    <!-- ── LOGIN FORM ──────────────────────────────────────────────────────── -->
    <form id="login-form" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label for="login-email">Email</label>
        <input type="email" id="login-email" placeholder="you@example.com" required />
      </div>
      <div class="form-group">
        <label for="login-password">Password</label>
        <input type="password" id="login-password" placeholder="Your password" required />
      </div>
      <button type="submit" class="btn btn-primary">Login</button>
      <div id="login-alert" class="alert"></div>
    </form>

    <!-- ── REGISTER FORM (hidden by default) ──────────────────────────────── -->
    <form id="register-form" style="display:none;" onsubmit="handleRegister(event)">
      <div class="form-group">
        <label for="reg-name">Full Name</label>
        <input type="text" id="reg-name" placeholder="Your name" required />
      </div>
      <div class="form-group">
        <label for="reg-email">Email</label>
        <input type="email" id="reg-email" placeholder="you@example.com" required />
      </div>
      <div class="form-group">
        <label for="reg-password">Password <small>(min 6 characters)</small></label>
        <input type="password" id="reg-password" placeholder="Choose a password" required />
      </div>
      <div class="form-group">
        <label for="reg-phone">Phone <small>(optional)</small></label>
        <input type="tel" id="reg-phone" placeholder="+60123456789" />
      </div>
      <button type="submit" class="btn btn-primary">Create Account</button>
      <div id="register-alert" class="alert"></div>
    </form>

  </div>
</div>

<script>
  // ── If already logged in, redirect to appropriate dashboard ──────────────
  const token = localStorage.getItem('token');
  const role  = localStorage.getItem('role');
  if (token) {
    // Already has a token — go straight to the right page
    window.location.href = role === 'admin' ? 'admin.html' : 'dashboard.html';
  }

  // ── Tab switcher ─────────────────────────────────────────────────────────
  function showTab(tab) {
    const loginForm    = document.getElementById('login-form');
    const registerForm = document.getElementById('register-form');
    const tabs         = document.querySelectorAll('.tab-btn');

    if (tab === 'login') {
      loginForm.style.display    = 'block';
      registerForm.style.display = 'none';
      tabs[0].classList.add('active');
      tabs[1].classList.remove('active');
    } else {
      loginForm.style.display    = 'none';
      registerForm.style.display = 'block';
      tabs[0].classList.remove('active');
      tabs[1].classList.add('active');
    }
  }

  // ── Show an alert message ─────────────────────────────────────────────────
  function showAlert(id, message, type) {
    const el = document.getElementById(id);
    el.textContent = message;
    el.className = `alert alert-${type} show`;
  }

  // ── Handle Login ──────────────────────────────────────────────────────────
  async function handleLogin(e) {
    e.preventDefault();
    const email    = document.getElementById('login-email').value;
    const password = document.getElementById('login-password').value;

    try {
      const res  = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });
      const data = await res.json();

      if (!res.ok) {
        // Show error from server (e.g., "Invalid email or password")
        showAlert('login-alert', data.message, 'error');
        return;
      }

      // Save the JWT and user info in localStorage
      // The token will be sent with every future API request
      localStorage.setItem('token', data.token);
      localStorage.setItem('role',  data.role);
      localStorage.setItem('name',  data.name);

      // Redirect based on role
      window.location.href = data.role === 'admin' ? 'admin.html' : 'dashboard.html';

    } catch (err) {
      showAlert('login-alert', 'Network error. Please try again.', 'error');
    }
  }

  // ── Handle Register ───────────────────────────────────────────────────────
  async function handleRegister(e) {
    e.preventDefault();
    const name     = document.getElementById('reg-name').value;
    const email    = document.getElementById('reg-email').value;
    const password = document.getElementById('reg-password').value;
    const phone    = document.getElementById('reg-phone').value;

    try {
      const res  = await fetch('/api/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, email, password, phone })
      });
      const data = await res.json();

      if (!res.ok) {
        showAlert('register-alert', data.message, 'error');
        return;
      }

      // Success — switch to login tab and show success message
      showTab('login');
      showAlert('login-alert', 'Account created! You can now log in.', 'success');

    } catch (err) {
      showAlert('register-alert', 'Network error. Please try again.', 'error');
    }
  }
</script>

</body>
</html>
